<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        {{ document_title }}

    </title>

    <style>

        body {

            font-family: Arial, Helvetica, sans-serif;
            margin: 30px;
            color: #222;
            background: #ffffff;

        }

        .document-header {

            border-bottom: 2px solid #000;
            padding-bottom: 12px;
            margin-bottom: 25px;

        }

        .document-title {

            font-size: 28px;
            font-weight: bold;

        }

        .document-meta {

            margin-top: 10px;
            font-size: 14px;

        }

        table {

            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;

        }

        th,
        td {

            border: 1px solid #333;
            padding: 8px;
            text-align: left;

        }

        th {

            background: #eeeeee;

        }

        .print-actions {

            margin-bottom: 30px;

        }

        .print-actions button {

            padding: 10px 20px;
            font-size: 15px;
            cursor: pointer;
            margin-right: 12px;

        }

        .footer {

            margin-top: 40px;
            font-size: 12px;
            text-align: center;
            color: #666;

        }

        @media print {
        
            @page {
        
                size: A4;
        
                margin: 12mm;
        
            }
        
            html,
            body {
        
                margin: 0;
                padding: 0;
                background: white;
        
            }
        
            .print-actions {
        
                display: none !important;
        
            }
        
            button {
        
                display: none !important;
        
            }
        
            a {
        
                text-decoration: none;
                color: black;
        
            }
        
            table {
        
                page-break-inside: avoid;
        
            }
        
            h1,
            h2,
            h3 {
        
                page-break-after: avoid;
        
            }
        
            tr {
        
                page-break-inside: avoid;
        
            }
        
        }

    </style>

</head>

<body>

<div class="document-header">

    <table
    style="border:none; margin-bottom:25px;">

        <tr>

            <td
            style="
                width:120px;
                border:none;
                vertical-align:top;">

                <div
                style="
                    width:90px;
                    height:90px;
                    border:2px solid #222;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-weight:bold;">

                    LOGO

                </div>

            </td>

            <td
            style="border:none;">

                <h1
                style="margin:0;">

                    Fashion House Manager

                </h1>

                <p style="margin:6px 0;">

                    Fashion House Name

                </p>

                <p style="margin:6px 0;">

                    Address

                </p>

                <p style="margin:6px 0;">

                    Phone

                </p>

                <p style="margin:6px 0;">

                    Email

                </p>

            </td>

        </tr>

    </table>

    <hr>

    <h2>

        {{ document_title }}

    </h2>

    <p>

        <strong>

            Document No:

        </strong>

        {{ document_number }}

    </p>

    <p>

        <strong>

            Generated:

        </strong>

        {{ generated_at.strftime("%d %B %Y %I:%M %p") }}

    </p>

</div>

<div class="print-actions">

    <button
    onclick="window.print()">

        🖨 Print Document

    </button>

    <button
    onclick="window.location.href='{{ url_for(
        "measurement.view_measurement",
        measurement_id=measurement.id
    ) }}'">

        ⬅ Back

    </button>

</div>

{% block document_content %}

{% endblock %}

<div class="footer">

    Generated by Ateliier

</div>


{% if download_mode %}

<script>

window.onload = function () {

    window.print();

};

</script>

{% endif %}

</body>

</html>
