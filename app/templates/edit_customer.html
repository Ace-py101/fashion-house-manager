{% extends "base.html" %}

{% block title %}
Edit Customer
{% endblock %}

{% block page_title %}
Edit Customer
{% endblock %}

{% block breadcrumb %}

<a href="/">
    Dashboard
</a><span> / </span>

<a href="{{ url_for('customer.customers') }}">
    Customers
</a><span> / </span>

<span>
    Edit Customer
</span>{% endblock %}

{% block content %}

<div class="card"><div class="card-header">

    <h2>
        Edit Customer
    </h2>

</div>


<div class="card-body">

    <form
        method="POST"
        action="{{ url_for(
            'customer.edit_customer',
            customer_id=customer.id
        ) }}"
        class="app-form"
    >


        <div class="form-group">

            <label for="full_name">
                Full Name
            </label>

            <input
                id="full_name"
                type="text"
                name="full_name"
                value="{{ customer.full_name }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="phone">
                Phone Number
            </label>

            <input
                id="phone"
                type="text"
                name="phone"
                value="{{ customer.phone }}"
                required
            >

        </div>


        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                id="email"
                type="email"
                name="email"
                value="{{ customer.email or '' }}"
            >

        </div>


        <div class="form-group">

            <label for="address">
                Address
            </label>

            <textarea
                id="address"
                name="address"
                rows="3"
            >{{ customer.address or '' }}</textarea>

        </div>


        <div class="form-group">

            <label for="gender">
                Gender
            </label>


            <select
                id="gender"
                name="gender"
                required
            >

                <option value="">
                    Select Gender
                </option>


                <option
                    value="Male"
                    {% if customer.gender == "Male" %}
                    selected
                    {% endif %}
                >
                    Male
                </option>


                <option
                    value="Female"
                    {% if customer.gender == "Female" %}
                    selected
                    {% endif %}
                >
                    Female
                </option>


            </select>


        </div>


        <div class="form-group">

            <label for="notes">
                Notes
            </label>


            <textarea
                id="notes"
                name="notes"
                rows="4"
            >{{ customer.notes or '' }}</textarea>


        </div>


        <div class="form-actions">


            <button
                type="submit"
                class="button"
            >
                Update Customer
            </button>


            <a
                href="{{ url_for(
                    'customer.view_customer',
                    customer_id=customer.id
                ) }}"
                class="button secondary"
            >
                Cancel
            </a>


        </div>


    </form>


</div>

</div>{% endblock %}
