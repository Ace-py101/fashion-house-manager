{% extends "base.html" %}

{% block title %}
New Style
{% endblock %}

{% block page_title %}
New Style
{% endblock %}

{% block breadcrumb %}

<a href="{{ url_for('main.index') }}">
    Dashboard
</a>

<span> / </span>

<a href="{{ url_for('style.styles') }}">
    Styles Gallery
</a>

<span> / </span>

<span>
    New Style
</span>

{% endblock %}

{% block content %}

<div class="card">

    <div class="card-header">

        <h2>
            Upload New Style
        </h2>

    </div>

    <div class="card-body">

        <form
            method="POST"
            enctype="multipart/form-data"
            class="app-form"
        >

            <div class="form-group">

                <label for="style_image">
                    Upload Style Image
                </label>

                <input
                    type="file"
                    id="style_image"
                    name="style_image"
                    accept=".jpg,.jpeg,.png,.webp"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="style_name">
                        Style Name
                    </label>

                    <input
                        type="text"
                        id="style_name"
                        name="style_name"
                        maxlength="150"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="style_type">
                        Style Type
                    </label>

                    <select
                        id="style_type"
                        name="style_type"
                        required
                    >

                        <option value="">
                            Select Style Type
                        </option>

                        {% for option in style_types %}

                        <option value="{{ option }}">
                            {{ option }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="occasion_fit">
                        Occasion / Fit
                    </label>

                    <select
                        id="occasion_fit"
                        name="occasion_fit"
                        required
                    >

                        <option value="">
                            Select Occasion / Fit
                        </option>

                        {% for option in occasion_fits %}

                        <option value="{{ option }}">
                            {{ option }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label for="garment_name">
                        Garment Name
                    </label>

                    <select
                        id="garment_name"
                        name="garment_name"
                        required
                    >

                        <option value="">
                            Select Garment
                        </option>

                        {% for option in garment_names %}

                        <option value="{{ option }}">
                            {{ option }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="gender">
                        Gender
                    </label>

                    <select
                        id="gender"
                        name="gender"
                        required
                    >

                        <option value="">
                            Select Gender
                        </option>

                        {% for option in genders %}

                        <option value="{{ option }}">
                            {{ option }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="form-group">

                    <label for="fabric_requirement">
                        Fabric Requirement
                    </label>

                    <input
                        type="text"
                        id="fabric_requirement"
                        name="fabric_requirement"
                        maxlength="150"
                        placeholder="e.g. 4 yards"
                        required
                    >

                </div>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select
                        id="status"
                        name="status"
                        required
                    >

                        <option value="">
                            Select Status
                        </option>

                        {% for option in statuses %}

                        <option
                            value="{{ option }}"
                            {% if option == "Active" %}
                                selected
                            {% endif %}
                        >
                            {{ option }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

            </div>


            <div class="page-actions">

                <a
                    href="{{ url_for('style.view_styles') }}"
                    class="button button-secondary"
                >
                    ← View Styles
                </a>

                <button
                    type="submit"
                    class="button button-success"
                >
                    📤 Upload Style
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
