<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | Ateliier</title>

    <style>

        :root {
            --obsidian: #111111;
            --charcoal: #181818;
            --gold: #D4AF37;
            --ivory: #F5F1E8;
            --champagne: #A89F91;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: var(--obsidian);
            color: var(--ivory);
            font-family: Arial, Helvetica, sans-serif;
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand-name {
            margin: 0;
            color: var(--gold);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 2rem;
            font-style: italic;
            letter-spacing: 0.16em;
        }

        .brand-line {
            width: 90px;
            height: 1px;
            margin: 10px auto 0;
            background: var(--gold);
        }

        .auth-card {
            padding: 32px;
            background: var(--charcoal);
            border: 1px solid rgba(212, 175, 55, 0.45);
            border-radius: 20px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-header h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .auth-header p {
            margin: 0;
            color: var(--champagne);
        }

        .flash-message {
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(212, 175, 55, 0.10);
            border: 1px solid rgba(212, 175, 55, 0.35);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            min-height: 54px;
            padding: 14px 16px;
            border: 1px solid rgba(245, 241, 232, 0.18);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.22);
            color: var(--ivory);
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: var(--gold);
        }

        .submit-button {
            width: 100%;
            min-height: 54px;
            border: none;
            border-radius: 12px;
            background: var(--gold);
            color: #111111;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .auth-footer {
            margin-top: 22px;
            text-align: center;
        }

        .auth-footer a {
            color: var(--gold);
            text-decoration: none;
        }

    </style>

</head>

<body>

    <main class="auth-container">

        <div class="brand">

            <p class="brand-name">
                Ateliier
            </p>

            <div
                class="brand-line"
                aria-hidden="true"
            ></div>

        </div>


        <section class="auth-card">

            <header class="auth-header">

                <h1>
                    Forgot Password
                </h1>

                <p>
                    Enter your email address to request a
                    password reset link.
                </p>

            </header>


            {% with messages = get_flashed_messages(
                with_categories=true
            ) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="flash-message">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form
                method="POST"
                novalidate
            >

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        maxlength="255"
                        autocomplete="email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="submit-button"
                >
                    SEND RESET LINK
                </button>

            </form>


            <div class="auth-footer">

                <a
                    href="{{ url_for(
                        'auth.login'
                    ) }}"
                >
                    ← Back to Sign In
                </a>

            </div>

        </section>

    </main>

</body>

</html>
