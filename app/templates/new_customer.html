{% extends "base.html" %}

{% block title %}
New Customer
{% endblock %}

{% block page_title %}
New Customer
{% endblock %}

{% block breadcrumb %}
<a href="/">Dashboard</a>
<span> / </span>
<a href="{{ url_for('customer.customers') }}">
    Customers
</a>
<span> / </span>
<span>New Customer</span>
{% endblock %}

{% block content %}

<div class="card">

    <div class="card-header">
        <h2>Register New Customer</h2>
    </div>

    <div class="card-body">

        <form
            method="POST"
            action="{{ url_for('customer.new_customer') }}"
            class="app-form"
        >

            <div class="form-group">

                <label for="full_name">
                    Full Name
                </label>

                <input
                    id="full_name"
                    type="text"
                    name="full_name"
                    required
                >

            </div>

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    id="phone"
                    type="text"
                    name="phone"
                    required
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    id="email"
                    type="email"
                    name="email"
                >

            </div>

            <div class="form-group">

                <label for="address">
                    Address
                </label>

                <textarea
                    id="address"
                    name="address"
                    rows="3"
                ></textarea>

            </div>

            <div class="form-group">

                <label for="gender">
                    Gender
                </label>

                <select
                    id="gender"
                    name="gender"
                    required
                >

                    <option value="">
                        Select Gender
                    </option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label for="notes">
                    Notes
                </label>

                <textarea
                    id="notes"
                    name="notes"
                    rows="4"
                ></textarea>

            </div>

            <div class="form-actions">

                <button
                    type="submit"
                    class="button"
                >
                    Save Customer
                </button>

                <a
                    href="{{ url_for('customer.customers') }}"
                    class="button secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
